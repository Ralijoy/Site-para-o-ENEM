const cv=$('#bg'),cx=cv.getContext('2d');let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
const C=Array.from({length:innerWidth<600?4:7},(_,k)=>{const c={x:Math.random()*W,y:Math.random()*H,a:Math.random()*6.28,n:14+k*3,sz:4+Math.random()*5,sp:.35+Math.random()*.5,ph:Math.random()*9,s:[]};for(let i=0;i<c.n;i++)c.s.push({x:c.x,y:c.y});return c});

  for(let i=c.n-1;i>=0;i--){const s=c.s[i],p=c.s[Math.max(i-1,0)],q=c.s[Math.min(i+1,c.n-1)],ang=Math.atan2(p.y-q.y,p.x-q.x),r=c.sz*(1-i/c.n*.45)*(i==0?1.15:1)*(1+.2*Math.sin(t/260+i*.5+c.ph)),sw=Math.sin(t/190-i*.7)*.5;

 for(let i=1;i<K.n;i++){const p=K.s[i-1],q=K.s[i],ex=q.x-p.x,ey=q.y-p.y,e=Math.hypot(ex,ey)||1;q.x=p.x+ex/e*L;q.y=p.y+ey/e*L}
 for(let i=K.n-1;i>=0;i--){const q=K.s[i],p=K.s[Math.max(i-1,0)],n=K.s[Math.min(i+1,K.n-1)],ang=Math.atan2(p.y-n.y,p.x-n.x),
  r=K.sz*(1-i/K.n*.45)*(i?1:1.3)*(1+.15*Math.sin(t/200+i*.5))*(1+K.pulse*(i<5?.6:.25))*(K.hov?1.2:1),sw=RM?0:Math.sin(t/(90+(1-sp)*90)-i*.8)*(.25+.5*sp);
  cc.strokeStyle='rgba(20,50,20,.85)';cc.lineWidth=1.2;cc.beginPath();for(const sd of[1,-1]){const a=ang+sd*(1.57+sw);cc.moveTo(q.x,q.y);cc.lineTo(q.x+Math.cos(a)*r*2.3,q.y+Math.sin(a)*r*2.3)}cc.stroke();
  cc.fillStyle=i?(i%2?'#3f8a39':'#4f9a4a'):'#9bd17f';cc.strokeStyle='rgba(15,35,15,.75)';cc.beginPath();cc.ellipse(q.x,q.y,r*1.15,r*.9,ang,0,6.3);cc.fill();cc.stroke();
